export default "<div class=\"input-container\">\n    <label for=\"storage_dropbox_access_token\" trans>Access Token</label>\n    <input type=\"text\" id=\"storage_dropbox_access_token\" name=\"storage_dropbox_access_token\" [(ngModel)]=\"state.server['storage_dropbox_access_token']\" required>\n</div>\n\n<div class=\"input-container\">\n    <label for=\"storage_dropbox_root\" trans>Root Directory</label>\n    <input type=\"text\" id=\"storage_dropbox_root\" name=\"storage_dropbox_root\" [(ngModel)]=\"state.server['storage_dropbox_root']\" placeholder=\"/\">\n</div>\n";
