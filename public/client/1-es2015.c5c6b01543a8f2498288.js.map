export default "<div class=\"modal-header\">\n  <h2 mat-dialog-title [transValues]=\"{resource: modelName}\" trans>Find :resource</h2>\n  <button type=\"button\" (click)=\"close()\" class=\"no-style close-button\" tabindex=\"-1\">\n    <mat-icon svgIcon=\"close\"></mat-icon>\n  </button>\n</div>\n\n<mat-dialog-content>\n  <div class=\"input-container search-input-container\">\n    <input\n      type=\"text\"\n      placeholder=\"Search for :resource by name...\"\n      trans-placeholder\n      [transValues]=\"{resource: modelName}\"\n      [formControl]=\"searchFormControl\"\n    />\n    <loading-indicator [isVisible]=\"loading$ | async\" class=\"small\"></loading-indicator>\n  </div>\n\n  <div class=\"results\">\n    <div class=\"result\" *ngFor=\"let model of results$ | async\" (click)=\"close(model)\">\n      <img [src]=\"model.image\" alt=\"\" />\n      <div class=\"meta overflow-hidden\">\n        <div class=\"name overflow-hidden\">{{ model.name }}</div>\n        <div class=\"description overflow-hidden\" *ngIf=\"model.description\">{{ model.description }}</div>\n      </div>\n    </div>\n  </div>\n</mat-dialog-content>\n";
