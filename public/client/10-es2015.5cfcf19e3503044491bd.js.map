export default "<label for=\"space-input-{{id}}\" *ngIf=\"label\" trans>{{label}}</label>\n<div class=\"wrapper\">\n    <input type=\"number\" min=\"0\" id=\"space-input-{{id}}\" [formControl]=\"form.get('amount')\" placeholder=\"Optional...\" trans-placeholder>\n    <select [formControl]=\"form.get('unit')\">\n        <option [ngValue]=\"unit\" *ngFor=\"let unit of spaceUnits\" trans>{{unit}}</option>\n    </select>\n</div>\n<ng-content select=\".description\"></ng-content>\n<ng-content select=\".error\"></ng-content>";
