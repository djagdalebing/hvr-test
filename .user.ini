; ---------------------------------------------------------------------------
; Interim mitigation for CVE-2026-109619 ("php2shell"), disclosed 2026-10-21.
;
; A use-after-free in state retained between requests; unauthenticated RCE,
; CVSS 9.2, exploited in the wild since 2026-10-17. PHP's own guidance is that
; disabling session upload progress blunts this vector.
;
; THIS IS NOT A FIX. The only complete remedy is running a patched PHP:
; 8.2.35, 8.3.36, 8.4.27 or 8.5.12. This server runs 8.1.34, an end-of-life
; branch that gets no official patched release.
;
; Laravel does not use session upload progress, so turning it off costs us
; nothing. Safe to remove once PHP is upgraded.
; ---------------------------------------------------------------------------
session.upload_progress.enabled = 0
