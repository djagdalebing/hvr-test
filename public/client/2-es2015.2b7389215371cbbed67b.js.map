export default "<ng-container *ngIf=\"seasons$ | async as seasons\">\n    <div class=\"header\">\n        <button type=\"button\" mat-raised-button color=\"accent\" (click)=\"addSeason()\" [disabled]=\"loading$ | async\">Add Season</button>\n    </div>\n\n    <mat-accordion>\n        <mat-expansion-panel [expanded]=\"(activeSeason$ | async) === season.number\" class=\"mat-elevation-z0\" [ngClass]=\"'season-' + season.number + '-panel'\" *ngFor=\"let season of seasons; trackBy: trackByFn\">\n            <mat-expansion-panel-header>\n                <mat-panel-title>\n                    <span trans>Season</span>\n                    &nbsp;\n                    <span>{{season.number}}</span>\n                </mat-panel-title>\n            </mat-expansion-panel-header>\n\n            <ng-template matExpansionPanelContent>\n                <mat-tab-group animationDuration=\"0ms\" color=\"accent\">\n                    <mat-tab [label]=\"'Episodes' | trans\">\n                        <episodes-panel [season]=\"season\"></episodes-panel>\n                    </mat-tab>\n                    <mat-tab [label]=\"'Regular Cast' | trans\">\n                        <credits-panel type=\"cast\" [mediaItem]=\"season\"></credits-panel>\n                    </mat-tab>\n                    <mat-tab [label]=\"'Regular Crew' | trans\">\n                        <credits-panel type=\"crew\" [mediaItem]=\"season\"></credits-panel>\n                    </mat-tab>\n                </mat-tab-group>\n            </ng-template>\n\n            <mat-action-row>\n                <button type=\"button\" mat-button (click)=\"maybeDeleteSeason(season)\" trans>Delete</button>\n            </mat-action-row>\n        </mat-expansion-panel>\n    </mat-accordion>\n\n    <no-results-message *ngIf=\"!seasons.length\">\n        <span primary-text trans>Nothing to Display.</span>\n        <span secondary-text trans>This series does not have any seasons yet.</span>\n    </no-results-message>\n</ng-container>\n";
