export default "<button mat-raised-button color=\"accent\" (click)=\"uploadImage()\">\n    <mat-icon svgIcon=\"add\"></mat-icon>\n    <span trans>Upload Image</span>\n</button>\n\n<div cdkDropListGroup>\n    <div cdkDropList [cdkDropListEnterPredicate]=\"dropListEnterPredicate\" (cdkDropListDropped)=\"dropListDropped()\"></div>\n    <div class=\"images-grid\">\n        <div cdkDropList [cdkDropListEnterPredicate]=\"dropListEnterPredicate\" (cdkDropListDropped)=\"dropListDropped()\" *ngFor=\"let image of images$ | async\">\n            <media-image class=\"images-panel-media-image\" cdkDrag (cdkDragMoved)=\"dragMoved($event);\" [src]=\"image.url\" size=\"medium\" mode=\"landscape\">\n                <button mat-mini-fab color=\"warn\" (click)=\"deleteImage(image)\">\n                    <mat-icon svgIcon=\"delete\"></mat-icon>\n                </button>\n            </media-image>\n        </div>\n    </div>\n</div>";
