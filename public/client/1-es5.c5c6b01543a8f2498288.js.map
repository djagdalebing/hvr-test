export default "<ng-container *ngIf=\"user\">\n    <img [src]=\"user.avatar\" alt=\"\">\n    <a [routerLink]=\"url.generate(user)\" target=\"_blank\" class=\"link content\" *ngIf=\"haveUrl\">\n        <div>{{user.display_name}}</div>\n        <div class=\"email secondary\">{{user.email}}</div>\n    </a>\n    <div class=\"content\" *ngIf=\"!haveUrl\">\n        <div>{{user.display_name}}</div>\n        <div class=\"email secondary\">{{user.email}}</div>\n    </div>\n</ng-container>\n";
