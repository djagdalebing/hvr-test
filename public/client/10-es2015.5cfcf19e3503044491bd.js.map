export default "<material-navbar\n  menuPosition=\"admin-navbar\"\n  color=\"primary\"\n  [showToggleButton]=\"true\"\n  (toggleButtonClick)=\"sidenav.toggleSidebarMode()\"\n>\n</material-navbar>\n\n<sidenav>\n  <nav>\n    <custom-menu\n      [position]=\"menu\"\n      [vertical]=\"true\"\n      [compact]=\"sidenav.isCompact$ | async\"\n    ></custom-menu>\n    <div class=\"version\">{{ 'Version:' | trans }} {{ settings.get('version') }}</div>\n  </nav>\n  <main>\n    <div class=\"content-inner\">\n      <router-outlet></router-outlet>\n    </div>\n  </main>\n</sidenav>\n";
