<div class="hvn-episodes" *ngIf="!loading && seasons.length">
    <div class="hvn-episodes-head">
        <h2>Episodes</h2>
        <span class="hvn-episodes-total">
            {{ totalEpisodes }} episode{{ totalEpisodes === 1 ? '' : 's' }}
            <ng-container *ngIf="seasons.length > 1">across {{ seasons.length }} seasons</ng-container>
        </span>
    </div>

    <ul class="hvn-season-list">
        <li *ngFor="let s of seasons">
            <a class="hvn-season-row" [routerLink]="seasonLink(s)">
                <span class="hvn-season-name">Season {{ s.number }}</span>
                <span class="hvn-season-count">{{ countLabel(s) }}</span>
                <span class="hvn-season-go" aria-hidden="true">›</span>
            </a>
        </li>
    </ul>
</div>
