export default "<mat-icon svgIcon=\"link\" class=\"link-icon\"></mat-icon>\n<ng-container *ngIf=\"editing$ | async; else editButton\">\n  <div class=\"nowrap\">{{ fullBaseUri + getPrefix() }}</div>\n  <div class=\"input-container\">\n    <input type=\"text\" [formControl]=\"slugControl\" />\n  </div>\n  <button type=\"button\" mat-flat-button color=\"gray\" class=\"action-button\" (click)=\"save()\" trans>\n    Save\n  </button>\n</ng-container>\n\n<ng-template #editButton>\n  <ng-container *ngIf=\"fullBaseUri + getPrefix() + (slug$ | async) as fullUrl\">\n    <a class=\"nowrap\" [href]=\"fullUrl\" target=\"_blank\" [title]=\"fullUrl\">{{ fullUrl }}</a>\n  </ng-container>\n  <button\n    type=\"button\"\n    mat-flat-button\n    color=\"gray\"\n    class=\"action-button\"\n    (click)=\"startEditing()\"\n    trans\n  >\n    Edit\n  </button>\n</ng-template>\n";
