export default "<ng-template #navItems>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"general\" routerLinkActive=\"selected\"><div class=\"name\" trans>General</div></a>\n    <a class=\"nav-item\" mat-menu-item *ngFor=\"let route of appRoutes()\" [routerLink]=\"route.path\" routerLinkActive=\"selected\"><div class=\"name\" trans>{{route.path.replace('-', ' ')}}</div></a>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"billing\" *ngIf=\"settings.get('billing.integrated')\" routerLinkActive=\"selected\"><div class=\"name\" trans>Billing</div></a>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"localization\" routerLinkActive=\"selected\"><div class=\"name\" trans>Localization</div></a>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"authentication\" routerLinkActive=\"selected\"><div class=\"name\" trans>Authentication</div></a>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"uploading\" routerLinkActive=\"selected\"><div class=\"name\" trans>Uploading</div></a>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"mail\" routerLinkActive=\"selected\"><div class=\"name\" trans>Mail</div></a>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"cache\" routerLinkActive=\"selected\"><div class=\"name\" trans>Cache</div></a>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"analytics\" routerLinkActive=\"selected\"><div class=\"name\" trans>Analytics</div></a>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"logging\" routerLinkActive=\"selected\"><div class=\"name\" trans>Logging</div></a>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"queue\" routerLinkActive=\"selected\"><div class=\"name\" trans>Queue</div></a>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"recaptcha\" routerLinkActive=\"selected\"><div class=\"name\" trans>Recaptcha</div></a>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"gdpr\" routerLinkActive=\"selected\"><div class=\"name\" trans>GDPR</div></a>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"/admin/appearance\" [queryParams]=\"{panel: 'menus'}\" routerLinkActive=\"selected\"><div class=\"name\" trans>Menus</div></a>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"/admin/appearance\" [queryParams]=\"{panel: 'seo-settings'}\" routerLinkActive=\"selected\"><div class=\"name\" trans>Seo</div></a>\n    <a class=\"nav-item\" mat-menu-item routerLink=\"/admin/appearance\" [queryParams]=\"{panel: 'themes'}\" routerLinkActive=\"selected\"><div class=\"name\" trans>Themes</div></a>\n</ng-template>\n\n<ng-container *ngIf=\"breakpoints.isMobile$ | async; else desktopNav\">\n    <button [matMenuTriggerFor]=\"navMenu\" class=\"no-style admin-pill-nav-mobile-selector\">\n        <span class=\"name\" trans>{{activePanel$ | async}}</span>\n        <mat-icon svgIcon=\"keyboard-arrow-down\"></mat-icon>\n    </button>\n    <mat-menu #navMenu=\"matMenu\" class=\"admin-pill-nav-menu\">\n        <ng-container *ngTemplateOutlet=\"navItems\"></ng-container>\n    </mat-menu>\n</ng-container>\n\n<ng-template #desktopNav>\n    <aside class=\"admin-pill-nav rounded\">\n        <ng-container *ngTemplateOutlet=\"navItems\"></ng-container>\n    </aside>\n</ng-template>\n\n<div class=\"settings-panels-container\">\n    <router-outlet></router-outlet>\n</div>\n";
