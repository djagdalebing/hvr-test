<div class="hvn-episodes" *ngIf="!loading && seasons.length">
    <div class="hvn-episodes-head">
        <h2>Episodes</h2>
        <div class="hvn-season-tabs" *ngIf="seasons.length > 1">
            <button type="button"
                    *ngFor="let s of seasons"
                    class="hvn-season-tab"
                    [class.active]="active?.number === s.number"
                    (click)="selectSeason(s)">
                Season {{ s.number }}
            </button>
        </div>
        <span class="hvn-season-single" *ngIf="seasons.length === 1">
            Season {{ seasons[0].number }}
        </span>
    </div>

    <ul class="hvn-episode-list" *ngIf="active">
        <li class="hvn-episode" *ngFor="let ep of active.episodes">
            <a class="hvn-episode-thumb" [routerLink]="episodeLink(ep)">
                <img *ngIf="posterFor(ep)" [src]="posterFor(ep)" [alt]="ep.name">
                <span class="hvn-episode-thumb-empty" *ngIf="!posterFor(ep)">
                    S{{ ep.season }}E{{ ep.number }}
                </span>
                <span class="hvn-episode-play" *ngIf="ep.playable">▶</span>
            </a>
            <div class="hvn-episode-body">
                <a class="hvn-episode-title" [routerLink]="episodeLink(ep)">
                    {{ ep.number }}. {{ ep.name }}
                </a>
                <p class="hvn-episode-desc" *ngIf="ep.description">{{ ep.description }}</p>
                <span class="hvn-episode-soon" *ngIf="!ep.playable">Coming soon</span>
            </div>
        </li>
    </ul>
</div>
