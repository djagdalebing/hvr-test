export default "<datatable-header>\n    <button mat-raised-button color=\"accent\" leftContent (click)=\"openTagManagerModal()\">\n        {{ 'Add' | trans }} {{ (displayType || (type + 's') ) | trans }}\n    </button>\n</datatable-header>\n\n<table class=\"material-table\">\n    <thead>\n    <tr>\n        <th table-sort-header trans>Name</th>\n        <th table-sort-header trans>Display Name</th>\n        <th></th>\n    </tr>\n    </thead>\n    <tbody>\n    <tr *ngFor=\"let tag of datatable.data$ | async\">\n        <td>{{tag.name}}</td>\n        <td>{{tag.display_name || '-'}}</td>\n        <td class=\"edit-column\">\n            <button mat-icon-button (click)=\"detachTag(tag)\">\n                <mat-icon svgIcon=\"close\"></mat-icon>\n            </button>\n        </td>\n    </tr>\n    </tbody>\n</table>\n\n<no-results-message *ngIf=\"!(datatable.data$ | async).length\" svgImage=\"folder.svg\">\n    <span primary-text trans>Nothing to display</span>\n</no-results-message>\n";
