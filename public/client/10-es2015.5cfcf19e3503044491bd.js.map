export default "<form class=\"input-container\" *ngIf=\"!readonly\" ngNativeValidate (ngSubmit)=\"selectTagsFromString(formControl.value)\">\n    <div class=\"input-with-action\">\n        <input type=\"text\" class=\"tags-string-input\" [matAutocomplete]=\"auto\" [formControl]=\"formControl\" required>\n        <button type=\"submit\" class=\"add-tags-button\" mat-flat-button color=\"accent\" trans>Add</button>\n    </div>\n</form>\n\n<p class=\"main-info\" *ngIf=\"!readonly\" [transValues]=\"{tagName: pluralName}\" trans>Separate :tagName with comma.</p>\n\n<div class=\"selected-tags\">\n    <mat-chip-list [selectable]=\"false\">\n        <mat-chip (removed)=\"deselectTag(tag)\" [removable]=\"!readonly\" *ngFor=\"let tag of selectedTags$ | async\">\n            <span>{{tag}}</span>\n            <mat-icon svgIcon=\"cancel\" matChipRemove></mat-icon>\n        </mat-chip>\n    </mat-chip-list>\n</div>\n\n<div class=\"existing-tags\" *ngIf=\"!readonly\">\n    <p [transValues]=\"{tagName: pluralName}\" trans>Choose from existing :tagName:</p>\n    <div class=\"existing-tags-list\">\n        <div class=\"existing-tag-name\" *ngFor=\"let tag of existingTags$ | async\" (click)=\"selectTags([tag.name])\">{{tag.display_name}}</div>\n    </div>\n</div>\n\n<mat-autocomplete #auto=\"matAutocomplete\" (optionSelected)=\"selectTags([$event.option.value])\">\n    <mat-option *ngFor=\"let tag of suggestedTags$ | async\" [value]=\"tag.name\">{{tag.display_name}}</mat-option>\n</mat-autocomplete>\n";
