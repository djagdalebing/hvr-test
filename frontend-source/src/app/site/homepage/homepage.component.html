<slider [list]="sliderList">
  <media-item-header [transparent]="true"></media-item-header>
</slider>

<ad-host slot="ads.shared" class="shared-ad-host"></ad-host>

<section class="lists">
  <ng-container *ngFor="let list of lists$ | async; index as index">
    <div class="list">
      <div class="container">
        <h2>
          <!-- Real lists (numeric id) link to their list page. HVN computed rows
               (Exclusive / Editor's Pick / Highest Viewed) have string ids like
               'hvn-exclusive' with no backing list, so their header is plain text
               instead of a dead link to /lists. -->
          <a *ngIf="+list.id > 0; else plainHeading" [routerLink]="['/lists', list.id]">{{ list.name }}</a>
          <ng-template #plainHeading>{{ list.name }}</ng-template>
        </h2>
        <p *ngIf="list.description">{{ list.description }}</p>

        <!-- Netflix-style horizontal row: fixed-width poster cards that scroll
             sideways, with hover arrows. Scoped to the homepage via .nf-row. -->
        <div class="nf-row">
          <button
            class="nf-arrow nf-arrow-left no-style"
            type="button"
            tabindex="-1"
            [attr.aria-label]="'Scroll left' | trans"
            (click)="scrollRow($event, -1)"
          >
            <mat-icon svgIcon="keyboard-arrow-left"></mat-icon>
          </button>

          <!-- Netflix-style rows always use wide landscape (16:9) cards. -->
          <media-view
            [mode]="modes.Landscape"
            [items]="list.items"
            class="full-width nf-scroll"
            [showPlayButton]="settings.get('homepage.show_play_buttons')"
          ></media-view>

          <button
            class="nf-arrow nf-arrow-right no-style"
            type="button"
            tabindex="-1"
            [attr.aria-label]="'Scroll right' | trans"
            (click)="scrollRow($event, 1)"
          >
            <mat-icon svgIcon="keyboard-arrow-right"></mat-icon>
          </button>
        </div>
      </div>
    </div>

    <ad-host slot="ads.homepage" *ngIf="index === 0" class="homepage-ad-host"></ad-host>
  </ng-container>
  <no-results-message
    *ngIf="currentUser.hasPermission('admin') && !(lists$ | async).length"
    svgImage="task-list.svg"
  >
    <span primary-text trans>No homepage content yet.</span>
    <span secondary-text trans
      >Assign some lists to the homepage from &ngsp;
      <a routerLink="/admin/appearance/homepage" [queryParams]="{panel: 'homepage'}"
        >appearance editor</a
      >.</span
    >
  </no-results-message>
</section>

<footer></footer>
