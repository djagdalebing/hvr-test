<media-item-header></media-item-header>

<div class="hvn-page">
    <a routerLink="/creators" class="back-link">← Back to Creators</a>

    <mat-progress-bar *ngIf="loading" mode="indeterminate" color="accent"></mat-progress-bar>

    <div class="not-found" *ngIf="notFound">
        <h2>Creator not found</h2>
        <p>This creator doesn’t exist or is no longer active.</p>
    </div>

    <ng-container *ngIf="!loading && user && !notFound">
        <header class="profile-header">
            <div class="avatar">
                <img *ngIf="photoUrl(); else letter" [src]="photoUrl()" [alt]="displayName()">
                <ng-template #letter>{{ initial() }}</ng-template>
            </div>
            <div class="meta">
                <h1>{{ displayName() }}</h1>
                <div class="handle">{{ user.username }}</div>
                <div class="bio" *ngIf="profile?.bio">{{ profile.bio }}</div>
                <div class="socials" *ngIf="socialLinks().length">
                    <a *ngFor="let s of socialLinks()" [href]="s.url" target="_blank" rel="noopener" class="social-chip">
                        <mat-icon [svgIcon]="s.icon"></mat-icon>
                        <span>{{ s.label }}</span>
                    </a>
                </div>
            </div>
        </header>

        <section class="profile-section" *ngIf="projects.length">
            <h2>Previous work</h2>
            <ul class="project-grid">
                <li *ngFor="let p of projects" class="project-card">
                    <div class="project-thumb" [class.placeholder]="!projectImage(p)">
                        <img *ngIf="projectImage(p)" [src]="projectImage(p)" [alt]="p.title">
                    </div>
                    <div class="project-body">
                        <div class="project-title">{{ p.title }}</div>
                        <div class="project-sub">
                            <span *ngIf="p.role">{{ p.role }}</span>
                            <span *ngIf="p.role && p.year"> · </span>
                            <span *ngIf="p.year">{{ p.year }}</span>
                        </div>
                        <p class="project-desc" *ngIf="p.description">{{ p.description }}</p>
                        <a *ngIf="p.url" [href]="p.url" target="_blank" rel="noopener" class="project-link">Visit ↗</a>
                    </div>
                </li>
            </ul>
        </section>
    </ng-container>
</div>

<footer></footer>
